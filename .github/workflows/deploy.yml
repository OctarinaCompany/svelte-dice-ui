name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages serves whatever the last successful run uploaded, so a queued run may cancel an
# in-flight one — but never one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The gates run here too: a red build must not reach the published site.
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run test:unit -- --run

      - name: Build the static site
        # Pages serves this repository from /<repo>/, so every route and asset needs that prefix.
        # `vite.config.ts` refuses a BASE_PATH that is malformed rather than emitting broken links.
        run: pnpm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
